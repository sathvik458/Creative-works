<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4fbf6"/><stop offset="1" stop-color="#e2f2e8"/></linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b2350"/><stop offset="1" stop-color="#43306b"/></linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#wall)"/>
  <!-- ceiling lights -->
  <rect width="800" height="90" fill="#ffffff"/>
  <g fill="#e9fff1"><rect x="80" y="30" width="200" height="16" rx="8"/><rect x="320" y="30" width="200" height="16" rx="8"/><rect x="560" y="30" width="200" height="16" rx="8"/></g>
  <!-- brand stripe -->
  <rect y="90" width="800" height="18" fill="#2f9e6e"/><rect y="108" width="800" height="10" fill="#ff9f43"/><rect y="118" width="800" height="6" fill="#4f8fe0"/>
  <!-- night window -->
  <rect x="540" y="160" width="230" height="300" rx="12" fill="url(#win)"/>
  <g fill="#ffd36e" opacity=".85"><circle cx="600" cy="210" r="3"/><circle cx="700" cy="240" r="2"/><circle cx="650" cy="190" r="2"/></g>
  <g fill="#1d1838"><rect x="560" y="330" width="40" height="130"/><rect x="610" y="290" width="50" height="170"/><rect x="670" y="350" width="30" height="110"/><rect x="710" y="310" width="45" height="150"/></g>
  <g fill="#ffd36e" opacity=".7"><rect x="620" y="310" width="8" height="10"/><rect x="640" y="340" width="8" height="10"/><rect x="720" y="330" width="8" height="10"/><rect x="570" y="350" width="8" height="10"/></g>
  <rect x="650" y="160" width="10" height="300" fill="#e2f2e8"/>
  <!-- shelves -->
  <g>
    <rect x="30" y="170" width="480" height="380" rx="10" fill="#ffffff" stroke="#cfe3d6" stroke-width="4"/>
    <g fill="#cfe3d6"><rect x="30" y="260" width="480" height="8"/><rect x="30" y="360" width="480" height="8"/><rect x="30" y="460" width="480" height="8"/></g>
    <!-- onigiri row -->
    <g>
      <g transform="translate(60 205)"><path d="M0 45 L25 0 L50 45 Z" fill="#fffdf6" stroke="#d9d2c0" stroke-width="2"/><rect x="12" y="28" width="26" height="17" fill="#2d3b2f"/></g>
      <g transform="translate(125 205)"><path d="M0 45 L25 0 L50 45 Z" fill="#fffdf6" stroke="#d9d2c0" stroke-width="2"/><rect x="12" y="28" width="26" height="17" fill="#2d3b2f"/></g>
      <g transform="translate(190 205)"><path d="M0 45 L25 0 L50 45 Z" fill="#fffdf6" stroke="#d9d2c0" stroke-width="2"/><rect x="12" y="28" width="26" height="17" fill="#2d3b2f"/></g>
      <g transform="translate(255 205)"><path d="M0 45 L25 0 L50 45 Z" fill="#fffdf6" stroke="#d9d2c0" stroke-width="2"/><rect x="12" y="28" width="26" height="17" fill="#2d3b2f"/></g>
    </g>
    <g fill="#ff9f43"><rect x="330" y="215" width="70" height="40" rx="6"/><rect x="410" y="215" width="70" height="40" rx="6"/></g>
