    <g>
      <rect x="50" y="290" width="26" height="66" rx="6" fill="#4f8fe0"/><rect x="86" y="290" width="26" height="66" rx="6" fill="#ff6f91"/><rect x="122" y="290" width="26" height="66" rx="6" fill="#7bc47f"/><rect x="158" y="290" width="26" height="66" rx="6" fill="#ffd36e"/><rect x="194" y="290" width="26" height="66" rx="6" fill="#4f8fe0"/><rect x="230" y="290" width="26" height="66" rx="6" fill="#c792ea"/>
      <rect x="290" y="290" width="26" height="66" rx="6" fill="#ff6f91"/><rect x="326" y="290" width="26" height="66" rx="6" fill="#7bc47f"/><rect x="362" y="290" width="26" height="66" rx="6" fill="#ffd36e"/><rect x="398" y="290" width="26" height="66" rx="6" fill="#4f8fe0"/><rect x="434" y="290" width="26" height="66" rx="6" fill="#ff9f43"/><rect x="470" y="290" width="26" height="66" rx="6" fill="#7bc47f"/>
    </g>
    <!-- bento -->
    <g>
      <rect x="55" y="395" width="110" height="60" rx="8" fill="#2d2d2d"/><rect x="62" y="402" width="50" height="46" rx="4" fill="#fffdf6"/><circle cx="135" cy="418" r="12" fill="#c8782f"/><circle cx="148" cy="436" r="10" fill="#d98a3a"/>
      <rect x="185" y="395" width="110" height="60" rx="8" fill="#2d2d2d"/><rect x="192" y="402" width="50" height="46" rx="4" fill="#fffdf6"/><rect x="250" y="410" width="36" height="30" rx="4" fill="#e76f51"/>
      <rect x="315" y="395" width="110" height="60" rx="8" fill="#2d2d2d"/><rect x="322" y="402" width="50" height="46" rx="4" fill="#fffdf6"/><circle cx="398" cy="425" r="16" fill="#7bc47f"/>
    </g>
    <g fill="#ffffff" stroke="#e7a0b0" stroke-width="2"><rect x="60" y="490" width="80" height="44" rx="10"/><rect x="160" y="490" width="80" height="44" rx="10"/><rect x="260" y="490" width="80" height="44" rx="10"/><rect x="360" y="490" width="80" height="44" rx="10"/></g>
  </g>
  <!-- price tags -->
  <rect x="540" y="480" width="230" height="56" rx="10" fill="#ff6f91"/>
  <text x="655" y="517" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="800" fill="#fff">温かい！ HOT</text>
  <!-- floor -->
  <rect y="580" width="800" height="420" fill="#dfe9e2"/>
  <g stroke="#cbd9cf" stroke-width="3"><line x1="0" y1="660" x2="800" y2="660"/><line x1="0" y1="760" x2="800" y2="760"/><line x1="0" y1="880" x2="800" y2="880"/><line x1="200" y1="580" x2="120" y2="1000"/><line x1="400" y1="580" x2="400" y2="1000"/><line x1="600" y1="580" x2="680" y2="1000"/></g>
  <!-- counter -->
  <rect x="380" y="600" width="440" height="140" rx="12" fill="#2f9e6e"/>
  <rect x="380" y="600" width="440" height="22" rx="10" fill="#ffffff"/>
  <rect x="640" y="540" width="110" height="70" rx="8" fill="#3b3b4a"/><rect x="652" y="550" width="86" height="40" rx="4" fill="#9fe3c2"/>
  <rect x="470" y="560" width="120" height="44" rx="8" fill="#ffd36e"/><circle cx="500" cy="582" r="12" fill="#c8782f"/><circle cx="530" cy="582" r="12" fill="#d98a3a"/><circle cx="560" cy="582" r="12" fill="#c8782f"/>
</svg>
