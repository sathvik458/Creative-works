<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f1ec"/><stop offset="1" stop-color="#d6e6dd"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".25" r=".6"><stop offset="0" stop-color="#fff6dc" stop-opacity=".85"/><stop offset="1" stop-color="#fff6dc" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#wall)"/>
  <!-- brick feature wall -->
  <rect x="0" y="0" width="800" height="120" fill="#b5654a"/>
  <g stroke="#9c5039" stroke-width="3"><line x1="0" y1="40" x2="800" y2="40"/><line x1="0" y1="80" x2="800" y2="80"/></g>
  <g stroke="#9c5039" stroke-width="3"><line x1="60" y1="0" x2="60" y2="40"/><line x1="180" y1="0" x2="180" y2="40"/><line x1="300" y1="0" x2="300" y2="40"/><line x1="420" y1="0" x2="420" y2="40"/><line x1="540" y1="0" x2="540" y2="40"/><line x1="660" y1="0" x2="660" y2="40"/><line x1="120" y1="40" x2="120" y2="80"/><line x1="240" y1="40" x2="240" y2="80"/><line x1="360" y1="40" x2="360" y2="80"/><line x1="480" y1="40" x2="480" y2="80"/><line x1="600" y1="40" x2="600" y2="80"/><line x1="720" y1="40" x2="720" y2="80"/></g>
  <!-- pendant lamps -->
  <g stroke="#2d3a34" stroke-width="3"><line x1="220" y1="120" x2="220" y2="170"/><line x1="580" y1="120" x2="580" y2="170"/></g>
  <path d="M195 170 h50 l-8 28 h-34 z" fill="#2d3a34"/><path d="M555 170 h50 l-8 28 h-34 z" fill="#2d3a34"/>
  <circle cx="400" cy="250" r="300" fill="url(#glow)"/>
  <!-- menu board -->
  <rect x="80" y="220" width="400" height="250" rx="12" fill="#22302a"/>
  <text x="280" y="270" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#ffd166">MENU</text>
  <g font-family="sans-serif" font-size="22" fill="#f1f5f2">
    <text x="110" y="312">Latte</text><text x="450" y="312" text-anchor="end">£3.40</text>
    <text x="110" y="346">Flat white</text><text x="450" y="346" text-anchor="end">£3.60</text>
    <text x="110" y="380">Cappuccino</text><text x="450" y="380" text-anchor="end">£3.40</text>
    <text x="110" y="414">Tea</text><text x="450" y="414" text-anchor="end">£2.20</text>
    <text x="110" y="448">Croissant</text><text x="450" y="448" text-anchor="end">£2.50</text>
  </g>
  <!-- window -->
  <rect x="530" y="220" width="210" height="250" rx="12" fill="#a8dadc"/>
  <g fill="#ffffff" opacity=".7"><circle cx="590" cy="290" r="26"/><circle cx="620" cy="280" r="30"/><circle cx="650" cy="294" r="22"/></g>
  <g fill="#6c8a8f"><rect x="545" y="380" width="40" height="90"/><rect x="595" y="350" width="50" height="120"/><rect x="655" y="390" width="35" height="80"/><rect x="700" y="365" width="30" height="105"/></g>
  <rect x="530" y="220" width="210" height="250" rx="12" fill="none" stroke="#2d3a34" stroke-width="10"/>
  <rect x="630" y="220" width="10" height="250" fill="#2d3a34"/>
  <text x="635" y="200" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#2d3a34">OPEN 7am–6pm</text>
  <!-- counter -->
  <rect y="560" width="800" height="440" fill="#c9b79c"/>
  <g stroke="#b7a385" stroke-width="3"><line x1="0" y1="660" x2="800" y2="660"/><line x1="0" y1="780" x2="800" y2="780"/><line x1="0" y1="900" x2="800" y2="900"/></g>
  <rect x="0" y="600" width="800" height="150" fill="#2a9d8f"/>
  <rect x="0" y="590" width="800" height="22" fill="#e9f5f2"/>
  <!-- espresso machine -->
  <rect x="520" y="480" width="200" height="110" rx="14" fill="#9aa5ab"/>
  <rect x="535" y="495" width="170" height="40" rx="8" fill="#cfd8dc"/>
  <g fill="#37474f"><rect x="560" y="540" width="20" height="30" rx="4"/><rect x="620" y="540" width="20" height="30" rx="4"/><rect x="680" y="540" width="14" height="26" rx="4"/></g>
  <!-- cups + pastries -->
  <g fill="#ffffff" stroke="#2d3a34" stroke-width="3"><path d="M90 540 h50 l-6 50 h-38 z"/><path d="M160 540 h50 l-6 50 h-38 z"/></g>
  <g fill="#2a9d8f"><rect x="96" y="556" width="38" height="12"/><rect x="166" y="556" width="38" height="12"/></g>
  <rect x="260" y="545" width="190" height="50" rx="10" fill="#ffffff" opacity=".85"/>
  <g fill="#e9a03b"><path d="M280 585 q25 -40 50 0 z"/><path d="M340 585 q25 -40 50 0 z"/><path d="M398 585 q22 -34 44 0 z"/></g>
</svg>
