<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbeedb"/><stop offset="1" stop-color="#f3dcc0"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9c3a8"/><stop offset="1" stop-color="#b99c80"/></linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e6" stop-opacity=".9"/><stop offset="1" stop-color="#fff8e6" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#wall)"/>
  <!-- ceiling -->
  <rect width="800" height="150" fill="#e7d3b8"/>
  <g fill="#d6bf9f"><rect x="0" y="140" width="800" height="14"/><rect x="60" y="0" width="16" height="150"/><rect x="260" y="0" width="16" height="150"/><rect x="460" y="0" width="16" height="150"/><rect x="660" y="0" width="16" height="150"/></g>
  <g fill="#fffaf0"><rect x="110" y="60" width="110" height="14" rx="7"/><rect x="310" y="60" width="110" height="14" rx="7"/><rect x="510" y="60" width="110" height="14" rx="7"/></g>
  <rect x="0" y="154" width="800" height="300" fill="url(#light)"/>
  <!-- departure board -->
  <rect x="90" y="190" width="380" height="150" rx="12" fill="#24345c"/>
  <rect x="104" y="204" width="352" height="34" rx="6" fill="#33497d"/>
  <text x="120" y="229" font-family="sans-serif" font-size="20" font-weight="700" fill="#ffd36e">発車 Departures</text>
  <g font-family="monospace" font-size="20" fill="#ffffff">
    <text x="120" y="270">17:42  中央線  吉祥寺</text>
    <text x="120" y="302">17:45  総武線  千葉</text>
  </g>
  <g fill="#7be08f"><circle cx="430" cy="264" r="6"/><circle cx="430" cy="296" r="6"/></g>
  <!-- platform signs -->
  <rect x="520" y="190" width="90" height="90" rx="14" fill="#3f6fb5"/>
  <text x="565" y="258" text-anchor="middle" font-family="sans-serif" font-size="58" font-weight="800" fill="#fff">5</text>
  <rect x="624" y="190" width="90" height="90" rx="14" fill="#e76f51"/>
  <text x="669" y="258" text-anchor="middle" font-family="sans-serif" font-size="58" font-weight="800" fill="#fff">9</text>
  <text x="617" y="310" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#5a4a3a">番線 Platforms →</text>
  <!-- clock -->
  <circle cx="720" cy="390" r="36" fill="#fff" stroke="#24345c" stroke-width="6"/>
  <path d="M720 390 L720 366 M720 390 L738 398" stroke="#24345c" stroke-width="5" stroke-linecap="round"/>
  <!-- back wall & gate sign -->
  <rect x="0" y="420" width="800" height="200" fill="#ecd6bb"/>
  <rect x="250" y="440" width="300" height="56" rx="10" fill="#24345c"/>
  <text x="400" y="478" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="800" fill="#fff">改札  Ticket Gates</text>
  <!-- commuters silhouettes -->
  <g fill="#b9a38a" opacity=".8">
    <circle cx="120" cy="540" r="18"/><rect x="100" y="560" width="40" height="70" rx="16"/>
    <circle cx="180" cy="548" r="15"/><rect x="164" y="565" width="32" height="62" rx="14"/>
    <circle cx="640" cy="538" r="18"/><rect x="620" y="558" width="40" height="72" rx="16"/>
    <circle cx="700" cy="550" r="14"/><rect x="685" y="566" width="30" height="60" rx="13"/>
  </g>
  <!-- floor -->
  <rect x="0" y="620" width="800" height="380" fill="url(#floor)"/>
  <g stroke="#c8ae91" stroke-width="3" opacity=".7">
    <line x1="400" y1="620" x2="-200" y2="1000"/><line x1="400" y1="620" x2="100" y2="1000"/><line x1="400" y1="620" x2="400" y2="1000"/><line x1="400" y1="620" x2="700" y2="1000"/><line x1="400" y1="620" x2="1000" y2="1000"/>
    <line x1="0" y1="700" x2="800" y2="700"/><line x1="0" y1="800" x2="800" y2="800"/><line x1="0" y1="920" x2="800" y2="920"/>
  </g>
  <!-- ticket gates -->
  <g>
    <g fill="#cfd8e3"><rect x="40" y="580" width="70" height="120" rx="10"/><rect x="230" y="580" width="70" height="120" rx="10"/><rect x="500" y="580" width="70" height="120" rx="10"/><rect x="690" y="580" width="70" height="120" rx="10"/></g>
    <g fill="#3f6fb5"><rect x="40" y="580" width="70" height="20" rx="8"/><rect x="230" y="580" width="70" height="20" rx="8"/><rect x="500" y="580" width="70" height="20" rx="8"/><rect x="690" y="580" width="70" height="20" rx="8"/></g>
    <g fill="#7be08f"><circle cx="75" cy="620" r="7"/><circle cx="265" cy="620" r="7"/><circle cx="725" cy="620" r="7"/></g>
    <circle cx="535" cy="620" r="7" fill="#ff6b6b"/>
    <g fill="#e9c46a" opacity=".9"><rect x="110" y="630" width="50" height="12" rx="6"/><rect x="180" y="630" width="50" height="12" rx="6"/><rect x="570" y="630" width="50" height="12" rx="6"/><rect x="640" y="630" width="50" height="12" rx="6"/></g>
  </g>
</svg>
