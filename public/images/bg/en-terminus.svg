<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb38a"/><stop offset=".55" stop-color="#ffd6a5"/><stop offset="1" stop-color="#fdf0d5"/></linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#sky)"/>
  <circle cx="200" cy="300" r="80" fill="#fff3c4"/>
  <!-- fields + trees -->
  <path d="M0 560 C200 520 600 600 800 540 L800 700 L0 700 Z" fill="#a7c957"/>
  <path d="M0 600 C250 570 550 640 800 590 L800 700 L0 700 Z" fill="#6a994e"/>
  <g fill="#386641"><circle cx="560" cy="520" r="40"/><circle cx="610" cy="500" r="50"/><circle cx="660" cy="525" r="38"/><circle cx="120" cy="545" r="34"/></g>
  <g fill="#ffffff" opacity=".85"><ellipse cx="520" cy="170" rx="90" ry="24"/><ellipse cx="580" cy="150" rx="60" ry="22"/></g>
  <!-- station sign -->
  <rect x="370" y="380" width="14" height="300" fill="#5a4a3a"/>
  <rect x="250" y="360" width="260" height="90" rx="10" fill="#ffffff" stroke="#1d4e89" stroke-width="6"/>
  <text x="380" y="398" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#1d4e89">END OF THE LINE</text>
  <text x="380" y="432" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="900" fill="#1d1d2b">Far Meadow</text>
  <!-- buffer stop + platform -->
  <rect y="700" width="800" height="300" fill="#b9ad97"/>
  <rect y="860" width="800" height="22" fill="#ffd60a"/>
  <rect y="882" width="800" height="118" fill="#3b3b46"/>
  <g transform="translate(600 760)"><rect width="140" height="70" rx="8" fill="#e63946"/><rect x="10" y="10" width="120" height="16" fill="#ffffff"/><rect x="10" y="44" width="120" height="16" fill="#ffffff"/></g>
  <rect x="70" y="740" width="200" height="56" rx="10" fill="#1d4e89"/>
  <text x="170" y="776" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="800" fill="#ffffff">All change</text>
</svg>
