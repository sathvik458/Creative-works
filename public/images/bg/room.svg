<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe9d7"/><stop offset="1" stop-color="#f3d6bb"/></linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2458"/><stop offset="1" stop-color="#5a3f7a"/></linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff0bf" stop-opacity=".9"/><stop offset="1" stop-color="#fff0bf" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#wall)"/>
  <!-- window -->
  <rect x="420" y="140" width="300" height="300" rx="14" fill="url(#night)"/>
  <circle cx="640" cy="220" r="34" fill="#fff3c4"/>
  <g fill="#ffd36e" opacity=".8"><rect x="450" y="360" width="10" height="12"/><rect x="480" y="340" width="10" height="12"/><rect x="530" y="370" width="10" height="12"/></g>
  <g fill="#1d1838"><rect x="430" y="330" width="60" height="110"/><rect x="500" y="360" width="80" height="80"/><rect x="590" y="320" width="50" height="120"/><rect x="650" y="350" width="60" height="90"/></g>
  <rect x="420" y="140" width="300" height="300" rx="14" fill="none" stroke="#fffaf0" stroke-width="14"/>
  <rect x="563" y="140" width="14" height="300" fill="#fffaf0"/>
  <!-- curtain -->
  <path d="M400 120 h40 c-10 120 10 240 -10 340 h-30 z" fill="#ff9eb5"/><path d="M740 120 h-40 c10 120 -10 240 10 340 h30 z" fill="#ff9eb5"/>
  <!-- poster & shelf -->
  <rect x="80" y="160" width="180" height="230" rx="10" fill="#ffffff" stroke="#e7cfb4" stroke-width="5"/>
  <circle cx="170" cy="250" r="50" fill="#ff6f91"/><rect x="110" y="320" width="120" height="14" rx="7" fill="#7ec8e3"/><rect x="130" y="344" width="80" height="12" rx="6" fill="#e9c46a"/>
  <rect x="60" y="460" width="260" height="14" rx="4" fill="#c89f74"/>
  <g><rect x="80" y="410" width="22" height="50" fill="#4f8fe0"/><rect x="106" y="420" width="22" height="40" fill="#ff6f91"/><rect x="132" y="405" width="22" height="55" fill="#7bc47f"/><rect x="170" y="430" width="50" height="30" rx="6" fill="#ffd36e"/></g>
  <!-- lamp glow -->
  <circle cx="250" cy="520" r="180" fill="url(#lamp)"/>
  <!-- floor: tatami -->
  <rect y="600" width="800" height="400" fill="#d8cf9c"/>
  <g stroke="#bfb37f" stroke-width="5"><line x1="0" y1="760" x2="800" y2="760"/><line x1="400" y1="600" x2="400" y2="760"/><line x1="250" y1="760" x2="250" y2="1000"/><line x1="580" y1="760" x2="580" y2="1000"/></g>
  <!-- low table -->
  <rect x="200" y="690" width="400" height="30" rx="10" fill="#8a6446"/><rect x="230" y="720" width="20" height="60" fill="#6b4f3a"/><rect x="550" y="720" width="20" height="60" fill="#6b4f3a"/>
  <rect x="320" y="660" width="140" height="36" rx="6" fill="#2d2d2d"/><rect x="328" y="666" width="60" height="24" rx="3" fill="#fffdf6"/><circle cx="420" cy="678" r="10" fill="#c8782f"/><circle cx="440" cy="684" r="8" fill="#d98a3a"/>
  <rect x="490" y="670" width="44" height="22" rx="4" fill="#c8302f"/>
</svg>
