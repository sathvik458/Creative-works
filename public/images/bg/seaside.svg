    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fa3c7"/><stop offset="1" stop-color="#2e6f9c"/></linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#sky)"/>
  <circle cx="400" cy="440" r="90" fill="#ffefb0"/>
  <g fill="#ffffff" opacity=".85"><ellipse cx="160" cy="180" rx="90" ry="26"/><ellipse cx="220" cy="160" rx="60" ry="24"/><ellipse cx="620" cy="240" rx="100" ry="24"/></g>
  <!-- gulls -->
  <g stroke="#5a4a3a" stroke-width="5" fill="none" stroke-linecap="round"><path d="M200 300 q16 -16 32 0 q16 -16 32 0"/><path d="M520 330 q12 -12 24 0 q12 -12 24 0"/><path d="M600 280 q10 -10 20 0 q10 -10 20 0"/></g>
  <rect y="470" width="800" height="230" fill="url(#sea)"/>
