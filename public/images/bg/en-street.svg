<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d405b"/><stop offset=".6" stop-color="#81688f"/><stop offset="1" stop-color="#f2a07b"/></linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe8a3" stop-opacity=".9"/><stop offset="1" stop-color="#ffe8a3" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#sky)"/>
  <circle cx="640" cy="150" r="40" fill="#fff3c4"/>
  <g fill="#fff" opacity=".8"><circle cx="100" cy="90" r="2"/><circle cx="300" cy="60" r="1.5"/><circle cx="480" cy="110" r="2"/></g>
  <!-- terraced houses -->
  <g>
    <rect x="0" y="330" width="270" height="340" fill="#c97b63"/>
    <rect x="270" y="300" width="270" height="370" fill="#e8c39e"/>
    <rect x="540" y="340" width="260" height="330" fill="#9fb4c7"/>
    <g fill="#5b4b49"><rect x="0" y="310" width="270" height="24"/><rect x="270" y="280" width="270" height="24"/><rect x="540" y="320" width="260" height="24"/></g>
    <g fill="#ffe8a3"><rect x="40" y="380" width="70" height="90"/><rect x="160" y="380" width="70" height="90"/><rect x="310" y="350" width="70" height="90"/><rect x="430" y="350" width="70" height="90"/><rect x="580" y="390" width="70" height="90"/><rect x="690" y="390" width="70" height="90"/></g>
    <g stroke="#ffffff" stroke-width="5"><line x1="75" y1="380" x2="75" y2="470"/><line x1="195" y1="380" x2="195" y2="470"/><line x1="345" y1="350" x2="345" y2="440"/><line x1="465" y1="350" x2="465" y2="440"/><line x1="615" y1="390" x2="615" y2="480"/><line x1="725" y1="390" x2="725" y2="480"/></g>
    <!-- doors -->
    <rect x="95" y="520" width="80" height="150" rx="40" fill="#264653"/>
    <rect x="365" y="500" width="80" height="170" rx="40" fill="#e63946"/>
    <circle cx="430" cy="590" r="5" fill="#ffd166"/>
    <rect x="372" y="540" width="66" height="26" rx="6" fill="#ffffff"/>
    <text x="405" y="559" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="800" fill="#e63946">Flat 3B</text>
    <rect x="630" y="530" width="80" height="140" rx="40" fill="#2a9d8f"/>
  </g>
  <!-- post box -->
  <rect x="540" y="590" width="44" height="90" rx="20" fill="#d62828"/><rect x="545" y="612" width="34" height="6" fill="#1d1d1d"/>
  <!-- lamp post -->
  <rect x="225" y="420" width="10" height="270" fill="#1d1d2b"/><circle cx="230" cy="420" r="16" fill="#ffe8a3"/><circle cx="230" cy="420" r="110" fill="url(#lamp)"/>
  <!-- pavement + road -->
  <rect y="670" width="800" height="60" fill="#b8b2a7"/>
  <g stroke="#a39d92" stroke-width="3"><line x1="100" y1="670" x2="100" y2="730"/><line x1="300" y1="670" x2="300" y2="730"/><line x1="500" y1="670" x2="500" y2="730"/><line x1="700" y1="670" x2="700" y2="730"/></g>
  <rect y="730" width="800" height="270" fill="#4a4e69"/>
  <g fill="#f2e9e4" opacity=".85"><rect x="60" y="860" width="110" height="12" rx="6"/><rect x="260" y="860" width="110" height="12" rx="6"/><rect x="460" y="860" width="110" height="12" rx="6"/><rect x="660" y="860" width="110" height="12" rx="6"/></g>
  <!-- bus -->
  <g transform="translate(-40 730)">
    <rect x="0" y="0" width="230" height="120" rx="16" fill="#d62828"/>
    <g fill="#bde0fe"><rect x="16" y="14" width="40" height="34" rx="5"/><rect x="66" y="14" width="40" height="34" rx="5"/><rect x="116" y="14" width="40" height="34" rx="5"/><rect x="166" y="14" width="40" height="34" rx="5"/><rect x="16" y="62" width="40" height="34" rx="5"/><rect x="66" y="62" width="40" height="34" rx="5"/><rect x="116" y="62" width="40" height="34" rx="5"/></g>
    <circle cx="50" cy="122" r="16" fill="#1d1d1d"/><circle cx="180" cy="122" r="16" fill="#1d1d1d"/>
  </g>
