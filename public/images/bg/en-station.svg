<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="tunnel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9e4d8"/><stop offset="1" stop-color="#d8d0bf"/></linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3b46"/><stop offset="1" stop-color="#25252e"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".2" r=".7"><stop offset="0" stop-color="#fff8e1" stop-opacity=".8"/><stop offset="1" stop-color="#fff8e1" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="1000" fill="#cfc6b3"/>
  <!-- curved tunnel wall -->
  <path d="M-40 640 C-40 120 840 120 840 640 Z" fill="url(#tunnel)"/>
  <g stroke="#c4baa5" stroke-width="3" fill="none" opacity=".8">
    <path d="M20 640 C20 200 780 200 780 640"/><path d="M90 640 C90 260 710 260 710 640"/>
  </g>
  <!-- tile rows -->
  <g fill="#f4f0e6" opacity=".55">
    <rect x="60" y="430" width="680" height="10"/><rect x="40" y="470" width="720" height="10"/><rect x="30" y="510" width="740" height="10"/>
  </g>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <!-- lamps -->
  <g fill="#fffaf0"><rect x="180" y="190" width="120" height="12" rx="6"/><rect x="500" y="190" width="120" height="12" rx="6"/></g>
  <!-- departure board -->
  <rect x="200" y="250" width="400" height="120" rx="10" fill="#151821"/>
  <g font-family="monospace" font-size="22" fill="#ffb703">
    <text x="222" y="292">1  Camden Town    2 min</text>
    <text x="222" y="326">2  Kentish Town   6 min</text>
  </g>
  <text x="222" y="356" font-family="sans-serif" font-size="16" font-weight="700" fill="#8ecae6">NORTHBOUND · PLATFORM 2</text>
  <!-- platform sign -->
  <rect x="70" y="400" width="210" height="64" rx="8" fill="#1d4e89"/>
  <text x="175" y="443" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="800" fill="#ffffff">Platform 2</text>
  <rect x="520" y="400" width="210" height="64" rx="8" fill="#ffffff" stroke="#1d4e89" stroke-width="5"/>
  <text x="625" y="443" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="800" fill="#1d4e89">Way out →</text>
  <!-- poster -->
  <rect x="330" y="410" width="140" height="170" rx="6" fill="#ffd6a5"/>
  <circle cx="400" cy="470" r="34" fill="#e76f51"/>
  <rect x="352" y="520" width="96" height="10" rx="5" fill="#264653"/><rect x="362" y="540" width="76" height="8" rx="4" fill="#264653" opacity=".6"/>
  <!-- commuters -->
  <g fill="#9c917c" opacity=".85">
    <circle cx="110" cy="560" r="18"/><rect x="90" y="580" width="40" height="72" rx="16"/>
    <circle cx="690" cy="556" r="18"/><rect x="670" y="576" width="40" height="76" rx="16"/>
    <circle cx="740" cy="570" r="14"/><rect x="725" y="586" width="30" height="62" rx="13"/>
  </g>
  <!-- platform floor -->
  <path d="M0 640 L800 640 L800 1000 L0 1000 Z" fill="#b9ad97"/>
  <g stroke="#a99d86" stroke-width="3" opacity=".7"><line x1="0" y1="720" x2="800" y2="720"/><line x1="0" y1="820" x2="800" y2="820"/><line x1="0" y1="930" x2="800" y2="930"/></g>
  <!-- safety line + MIND THE GAP -->
  <rect x="0" y="880" width="800" height="26" fill="#ffd60a"/>
  <rect x="0" y="906" width="800" height="94" fill="url(#track)"/>
  <text x="400" y="870" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="900" letter-spacing="6" fill="#ffffff" opacity=".9">MIND THE GAP</text>
  <!-- ticket barriers -->
  <g>
    <g fill="#d9dde3"><rect x="20" y="620" width="70" height="110" rx="10"/><rect x="200" y="620" width="70" height="110" rx="10"/><rect x="530" y="620" width="70" height="110" rx="10"/><rect x="710" y="620" width="70" height="110" rx="10"/></g>
    <g fill="#1d4e89"><rect x="20" y="620" width="70" height="18" rx="8"/><rect x="200" y="620" width="70" height="18" rx="8"/><rect x="530" y="620" width="70" height="18" rx="8"/><rect x="710" y="620" width="70" height="18" rx="8"/></g>
    <g fill="#e63946"><rect x="90" y="664" width="44" height="12" rx="6"/><rect x="156" y="664" width="44" height="12" rx="6"/></g>
    <g fill="#80ed99"><rect x="600" y="664" width="44" height="12" rx="6"/><rect x="666" y="664" width="44" height="12" rx="6"/></g>
    <circle cx="55" cy="660" r="7" fill="#e63946"/><circle cx="745" cy="660" r="7" fill="#80ed99"/>
  </g>
</svg>
