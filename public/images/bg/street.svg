<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2458"/><stop offset=".55" stop-color="#7a4f8c"/><stop offset="1" stop-color="#f29e7a"/></linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe7a3" stop-opacity=".9"/><stop offset="1" stop-color="#ffe7a3" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#sky)"/>
  <g fill="#fff" opacity=".8"><circle cx="90" cy="80" r="2"/><circle cx="240" cy="140" r="1.5"/><circle cx="420" cy="60" r="2"/><circle cx="600" cy="120" r="1.5"/><circle cx="720" cy="50" r="2"/></g>
  <circle cx="640" cy="170" r="44" fill="#fff3c4"/><circle cx="660" cy="158" r="40" fill="#3a2f6a" opacity=".25"/>
  <!-- distant buildings -->
  <g fill="#3b2f63"><rect x="0" y="360" width="120" height="300"/><rect x="110" y="300" width="90" height="360"/><rect x="560" y="320" width="110" height="340"/><rect x="660" y="380" width="140" height="280"/></g>
  <g fill="#ffd36e" opacity=".8"><rect x="20" y="400" width="14" height="18"/><rect x="60" y="440" width="14" height="18"/><rect x="130" y="340" width="14" height="18"/><rect x="160" y="400" width="14" height="18"/><rect x="580" y="360" width="14" height="18"/><rect x="620" y="420" width="14" height="18"/><rect x="690" y="410" width="14" height="18"/><rect x="740" y="460" width="14" height="18"/></g>
  <!-- houses -->
  <g>
    <rect x="200" y="430" width="200" height="230" fill="#f2d6b3"/><path d="M180 440 L300 360 L420 440 Z" fill="#a8483c"/>
    <rect x="230" y="480" width="56" height="50" fill="#ffe7a3"/><rect x="314" y="480" width="56" height="50" fill="#ffe7a3"/><rect x="270" y="570" width="60" height="90" fill="#8a6446"/>
    <rect x="400" y="460" width="170" height="200" fill="#d9c7e8"/><path d="M385 470 L485 400 L585 470 Z" fill="#5a4a8a"/>
    <rect x="425" y="500" width="50" height="46" fill="#ffe7a3"/><rect x="500" y="500" width="50" height="46" fill="#ffe7a3"/>
    <text x="485" y="620" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="800" fill="#5a4a8a">寮 DORM</text>
  </g>
  <!-- vending machine -->
  <rect x="610" y="520" width="110" height="170" rx="10" fill="#e9eef7"/><rect x="622" y="532" width="86" height="80" rx="6" fill="#bfe3ff"/>
  <g fill="#ff6f91"><rect x="630" y="545" width="14" height="24" rx="3"/><rect x="652" y="545" width="14" height="24" rx="3"/></g><g fill="#7bc47f"><rect x="674" y="545" width="14" height="24" rx="3"/><rect x="630" y="578" width="14" height="24" rx="3"/></g><g fill="#ffd36e"><rect x="652" y="578" width="14" height="24" rx="3"/><rect x="674" y="578" width="14" height="24" rx="3"/></g>
  <circle cx="665" cy="600" r="120" fill="url(#lamp)" opacity=".35"/>
  <!-- street lamp -->
  <rect x="120" y="420" width="10" height="260" fill="#2b2340"/><circle cx="125" cy="420" r="16" fill="#ffe7a3"/><circle cx="125" cy="420" r="110" fill="url(#lamp)"/>
