  <g fill="#ffb3c6" opacity=".95"><circle cx="40" cy="520" r="60"/><circle cx="0" cy="470" r="50"/><circle cx="70" cy="460" r="40"/></g>
  <!-- road -->
  <rect y="660" width="800" height="340" fill="#4a4067"/>
  <rect y="660" width="800" height="30" fill="#5d5280"/>
  <g fill="#f4e1c1" opacity=".8"><rect x="60" y="820" width="100" height="12" rx="6"/><rect x="260" y="820" width="100" height="12" rx="6"/><rect x="460" y="820" width="100" height="12" rx="6"/><rect x="660" y="820" width="100" height="12" rx="6"/></g>
  <g fill="#ffb3c6" opacity=".8"><ellipse cx="200" cy="720" rx="6" ry="3"/><ellipse cx="420" cy="760" rx="6" ry="3"/><ellipse cx="560" cy="700" rx="6" ry="3"/><ellipse cx="320" cy="900" rx="6" ry="3"/></g>
